<!doctype html>
<html lang="en">
<head>
<meta charset="utf-8">
<meta name="viewport" content="width=device-width, initial-scale=1">
<title>EduZone Track Replies</title>
<style>
:root{--blue:#003BA3;--orange:#FF5C11;--bg:#f4f6fb;--card:#fff;--text:#1f2937;--muted:#6b7280;--line:#e5e7eb;--msg:#f9fafb;--chip:#eef2ff;}
@media (prefers-color-scheme:dark){:root{--bg:#0f1420;--card:#171e2e;--text:#e5e7eb;--muted:#9ca3af;--line:#2a3448;--msg:#111827;--chip:#1e2a44;}}
*{box-sizing:border-box}
body{margin:0;background:var(--bg);color:var(--text);font-family:-apple-system,"Segoe UI",Roboto,Arial,sans-serif;font-size:15px}
header{background:var(--blue);color:#fff;padding:18px 16px 14px}
header .wrap{max-width:1150px;margin:0 auto}
header h1{margin:0;font-size:22px}
header p{margin:4px 0 0;opacity:.85;font-size:13px}
.bar{position:sticky;top:0;z-index:10;background:var(--card);border-bottom:1px solid var(--line);box-shadow:0 2px 10px rgba(0,0,0,.06)}
.bar .wrap{max-width:1150px;margin:0 auto;padding:10px 16px;display:flex;flex-direction:column;gap:8px}
.row{display:flex;gap:8px;align-items:center;flex-wrap:wrap}
.nav{display:flex;gap:6px;overflow-x:auto;padding-bottom:2px;scrollbar-width:thin}
.nav a{flex:0 0 auto;display:flex;align-items:center;gap:6px;text-decoration:none;color:var(--text);background:var(--chip);border:1px solid var(--line);border-radius:999px;padding:6px 12px;font-size:13px;font-weight:600;white-space:nowrap}
.nav a:hover,.nav a.on{background:var(--blue);color:#fff;border-color:var(--blue)}
.nav a .i{font-size:16px}
.seg{display:inline-flex;border:1px solid var(--line);border-radius:10px;overflow:hidden}
.seg button{border:0;background:transparent;color:var(--text);padding:6px 12px;font-family:inherit;font-weight:600;font-size:13px;cursor:pointer}
.seg button.on{background:var(--orange);color:#fff}
.lbl{font-size:12px;color:var(--muted);font-weight:700;margin-right:2px}
main{max-width:1150px;margin:0 auto;padding:16px}
.card{background:var(--card);border:1px solid var(--line);border-radius:16px;margin:0 0 18px;overflow:hidden;scroll-margin-top:120px}
.ch{display:flex;align-items:center;gap:12px;padding:14px 16px;border-bottom:1px solid var(--line)}
.ic{font-size:30px;width:52px;height:52px;display:grid;place-items:center;background:var(--chip);border-radius:14px;flex:0 0 auto}
.ch h2{margin:0;font-size:18px}
.kind{display:inline-block;font-size:11px;font-weight:800;color:var(--orange);letter-spacing:.06em;text-transform:uppercase}
.facts{display:flex;flex-wrap:wrap;gap:6px;padding:10px 16px 0}
.facts span{font-size:12px;background:var(--chip);border-radius:8px;padding:4px 8px;color:var(--text)}
.msgs{display:grid;grid-template-columns:1fr 1fr;gap:14px;padding:14px 16px 16px}
.msgs.one{grid-template-columns:1fr}
.m{border:1px solid var(--line);border-radius:12px;background:var(--msg);display:flex;flex-direction:column;min-width:0}
.mh{display:flex;justify-content:space-between;align-items:center;gap:8px;padding:8px 10px;border-bottom:1px solid var(--line)}
.mh b{font-size:12px;color:var(--muted);letter-spacing:.06em}
.acts{display:flex;gap:6px}
.btn{border:0;border-radius:8px;padding:7px 12px;font-family:inherit;font-weight:700;font-size:13px;cursor:pointer;color:#fff;background:var(--blue);display:inline-flex;align-items:center;gap:5px}
.btn.wa{background:#25D366}
.btn.ok{background:#16a34a}
pre{margin:0;padding:12px;white-space:pre-wrap;overflow-wrap:anywhere;font-family:inherit;font-size:14px;line-height:1.65}
pre.ar{direction:rtl;text-align:right;font-size:15.5px;font-family:"Geeza Pro","Segoe UI","Noto Naskh Arabic",Tahoma,sans-serif}
.hide{display:none!important}
.toast{position:fixed;bottom:18px;left:50%;transform:translateX(-50%);background:#111827;color:#fff;padding:9px 16px;border-radius:999px;font-size:13px;opacity:0;transition:.2s;pointer-events:none;z-index:20}
.toast.show{opacity:1}
.rule{font-size:12px;color:var(--muted);margin:0 0 14px}
@media (max-width:760px){.msgs{grid-template-columns:1fr}.ch h2{font-size:16px}.btn{padding:7px 10px}}
</style>
</head>

<script>
var T=[{"id": "game-starter", "icon": "🎮", "name": "Game Coding Starter", "kind": "Starter", "age": "Ages 7–9.5", "facts": ["8 sessions", "weekly, 2 h", "Group (3–6) 3,150 EGP", "Private 1:1 4,500 EGP"], "ar": "أهلاً بيكم 👋\nفي EduZone Tech للبرمجة والروبوتات والذكاء الاصطناعي،\n\nعندنا أكتر من مسار مناسب لسن 7–9.5 سنة، وبنختار معاكم الأنسب حسب اهتمامات الطفل ومستواه.\n\nومن الاختيارات اللي بننصح بيها كتير كبداية للسن ده:\n\n🎮 *Game Coding Starter — من لاعب لصانع ألعاب*\n\nليه بنرشحه؟\nفي السن ده الطفل بيتعلم أسرع لما يبني حاجة بيحبها، والألعاب أقرب حاجة ليه.\nفبدل ما يتعلم البرمجة كمعلومات، بيستخدمها عشان يعمل لعبته بنفسه على *Scratch*: شخصيات بتتحرك، نقط، ومراحل.\nوالأهم إنه بيتعلم يدوّر على الغلطة ويصلّحها لما حاجة متشتغلش، ودي أساس التفكير البرمجي.\n\n📚 8 حصص — حصة أسبوعيًا، ساعتين.\n\n🎥 مثال من شغل طلابنا:\nhttps://www.instagram.com/reel/C6ExisuMNpA/\n\n💰 *السعر للتراك كامل:*\n👥 جروب (3–6 أطفال): 3,150 جنيه\n👤 برايفت 1:1: 4,500 جنيه — بمدرّب ثابت طول التراك + حصتين تعويض في حالة الغياب\n\nوبعده يقدر يكمّل على مستويات أعلى في برمجة الألعاب.\n\nابعتولنا اختياركم: *جروب ولا برايفت؟* 👇\nوهنبعتلكم المواعيد المتاحة حضوري وأونلاين 📅", "en": "Hello 👋\nAt EduZone Tech for Coding, Robotics & AI,\n\nwe offer several tracks suited to ages 7–9.5, and we help you choose the best fit based on your child's interests and level.\n\nOne of the options we often recommend as a first step for this age:\n\n🎮 *Game Coding Starter — From Player to Game Maker*\n\nWhy we recommend it:\nAt this age, children learn fastest when they build something they love, and games are the closest thing to their world.\nInstead of learning coding as theory, they use it to create their own game in *Scratch*: moving characters, scores, and levels.\nMost importantly, they learn to find and fix mistakes when something doesn't work, which is the foundation of programming thinking.\n\n📚 8 sessions — one session a week, 2 hours each.\n\n🎥 An example of our students' work:\nhttps://www.instagram.com/reel/C6ExisuMNpA/\n\n💰 *Full track price:*\n👥 Group (3–6 children): 3,150 EGP\n👤 Private 1:1: 4,500 EGP — with a fixed trainer for the whole track + 2 make-up sessions in case of absence\n\nAfterwards, they can continue to higher levels of game coding.\n\nSend us your choice: *Group or Private?* 👇\nand we'll share the available schedules, onsite and online 📅"}, {"id": "lego-starter", "icon": "🧱", "name": "LEGO Robotics Starter", "kind": "Starter", "age": "Ages 6–9", "facts": ["10 sessions", "weekly, 2 h", "Group (3–6) 4,200 EGP", "Private 1:1 6,000 EGP", "no recordings / materials"], "ar": "أهلاً بيكم 👋\nفي EduZone Tech للبرمجة والروبوتات والذكاء الاصطناعي،\n\nعندنا أكتر من مسار مناسب لسن 6–9 سنين، وبنختار معاكم الأنسب حسب شخصية الطفل وطريقة تعلّمه.\n\nولو الطفل بيحب يفك ويركّب ويتعلم بإيده، من أفضل البدايات ليه:\n\n🤖 *LEGO Robotics Starter — يبني، يبرمج ويجرّب*\n\nليه بنرشحه؟\nالأطفال في السن ده بيفهموا أعمق لما يلمسوا ويجرّبوا بنفسهم.\nبيبني روبوتات *LEGO WeDo* بإيده، ويبرمجها تتحرك وتنفّذ مهام، ولما النتيجة تختلف عن المتوقع بيعدّل التصميم ويجرّب تاني.\nوده بيبني عنده التفكير الهندسي وحل المشكلات من بدري. كل الشغل عملي جوه الحصة.\n\n📚 10 حصص — حصة أسبوعيًا، ساعتين.\n\n🎥 مثال من شغل أطفالنا:\nhttps://www.instagram.com/reel/DF5P2v_IXtl/\n\n💰 *السعر للتراك كامل:*\n👥 جروب (3–6 أطفال): 4,200 جنيه\n👤 برايفت 1:1: 6,000 جنيه — بمدرّب ثابت طول التراك + حصتين تعويض في حالة الغياب\n\nوبعده يقدر يكمّل على تراك Robotics Junior ويبدأ Arduino.\n\nابعتولنا اختياركم: *جروب ولا برايفت؟* 👇\nوهنبعتلكم المواعيد المتاحة حضوري وأونلاين 📅", "en": "Hello 👋\nAt EduZone Tech for Coding, Robotics & AI,\n\nwe offer several tracks suited to ages 6–9, and we help you choose the best fit based on your child's personality and learning style.\n\nIf your child loves taking things apart, building, and learning hands-on, one of the best first steps is:\n\n🤖 *LEGO Robotics Starter — Build, Code & Experiment*\n\nWhy we recommend it:\nChildren at this age understand more deeply when they touch and try things themselves.\nThey build *LEGO WeDo* robots by hand, program them to move and complete missions, and when the result is different from what they expected, they adjust the design and try again.\nThis builds engineering thinking and problem-solving from an early age. All the work is hands-on, inside the session.\n\n📚 10 sessions — one session a week, 2 hours each.\n\n🎥 An example of our children's work:\nhttps://www.instagram.com/reel/DF5P2v_IXtl/\n\n💰 *Full track price:*\n👥 Group (3–6 children): 4,200 EGP\n👤 Private 1:1: 6,000 EGP — with a fixed trainer for the whole track + 2 make-up sessions in case of absence\n\nAfterwards, they can continue to the Robotics Junior track and start Arduino.\n\nSend us your choice: *Group or Private?* 👇\nand we'll share the available schedules, onsite and online 📅"}, {"id": "mobile-starter", "icon": "📱", "name": "Mobile App Starter", "kind": "Starter", "age": "Ages 10–12", "facts": ["10 sessions", "weekly, 2 h", "Group (3–6) 4,200 EGP", "Private 1:1 6,000 EGP"], "ar": "أهلاً بيكم 👋\nفي EduZone Tech للبرمجة والروبوتات والذكاء الاصطناعي،\n\nعندنا أكتر من مسار مناسب لسن 10–12 سنة (ألعاب، تطبيقات، روبوتات، مواقع)، وبنختار معاكم الأنسب حسب اهتمام الطفل.\n\nومن أقوى البدايات للسن ده لو الطفل مهتم بالموبايل والتكنولوجيا:\n\n📱 *Mobile App Starter — يعمل أول تطبيق ليه*\n\nليه بنرشحه؟\nفي السن ده الطفل بقى قادر يفكّر في \"مشكلة وحل\"، والتطبيق بيترجم الفكرة دي لحاجة حقيقية في إيده.\nعلى *App Inventor* بيصمّم الشاشات، ويبرمج اللي يحصل مع كل زرار، ويجرّب التطبيق على الموبايل ويطوّره.\nوالنتيجة تطبيقات من شغله يقدر يفتحها ويعرضها بنفسه.\n\n📚 10 حصص — حصة أسبوعيًا، ساعتين.\n\n🎥 مثال من شغل طلابنا:\nhttps://www.instagram.com/reel/DExWhN_iMpx/\n\n💰 *السعر للتراك كامل:*\n👥 جروب (3–6 طلاب): 4,200 جنيه\n👤 برايفت 1:1: 6,000 جنيه — بمدرّب ثابت طول التراك + حصتين تعويض في حالة الغياب\n\nوبعده يقدر يكمّل على تراك Mobile App الكامل.\n\nابعتولنا اختياركم: *جروب ولا برايفت؟* 👇\nوهنبعتلكم المواعيد المتاحة حضوري وأونلاين 📅", "en": "Hello 👋\nAt EduZone Tech for Coding, Robotics & AI,\n\nwe offer several tracks suited to ages 10–12 (games, apps, robotics, websites), and we help you choose the best fit based on your child's interests.\n\nOne of the strongest first steps for this age, if your child is into phones and technology:\n\n📱 *Mobile App Starter — Build Their First App*\n\nWhy we recommend it:\nAt this age, children can think in terms of \"problem and solution,\" and an app turns that idea into something real in their hands.\nUsing *App Inventor*, they design the screens, code what happens with every button, then test the app on a phone and improve it.\nThe result: real apps they built themselves and can open and show you.\n\n📚 10 sessions — one session a week, 2 hours each.\n\n🎥 An example of our students' work:\nhttps://www.instagram.com/reel/DExWhN_iMpx/\n\n💰 *Full track price:*\n👥 Group (3–6 students): 4,200 EGP\n👤 Private 1:1: 6,000 EGP — with a fixed trainer for the whole track + 2 make-up sessions in case of absence\n\nAfterwards, they can continue to the full Mobile App track.\n\nSend us your choice: *Group or Private?* 👇\nand we'll share the available schedules, onsite and online 📅"}, {"id": "web", "icon": "💻", "name": "Web Programming", "kind": "Full track", "age": "Ages 10–16", "facts": ["15 sessions", "weekly, 2 h", "Group (3–6) 8,120 EGP", "Private 1:1 11,600 EGP"], "ar": "أهلاً بيكم 👋\nفي EduZone Tech للبرمجة والروبوتات والذكاء الاصطناعي،\n\nعندنا أكتر من مسار مناسب لسن 10–16 سنة (ألعاب، تطبيقات، روبوتات، مواقع، ذكاء اصطناعي)، وبنختار معاكم الأنسب حسب سن الطالب وخبرته واهتمامه.\n\nولو الطالب عنده فكرة نفسه يحوّلها لموقع حقيقي، من أقوى الاختيارات ليه:\n\n💻 *Web Programming — يبني موقع لفكرته*\n\nليه بنرشحه؟\nتصميم وبرمجة المواقع من أكتر المهارات المطلوبة فعليًا، والطالب بيشوف نتيجة شغله أول بأول على الشاشة.\nبيتعلّم يبني صفحات بـ *HTML وCSS وJavaScript*، يضيف لها تفاعل، ويخلّي تصميمها مناسب للموبايل، وبيستعين بأدوات AI أثناء التعلّم.\nوفي الآخر بيطبّق اللي اتعلّمه على متجر إلكتروني بسيط — ويخرج بمشروع يعرضه وي  واهتمامه.\n\nولو الطالب جرّب البرمجة قبل كده وعايز يطوّر مستواه في الألعاب، من أقوى الخطوات التالية ليه:\n\n🎮 *Game Engine — من تدريبات منفصلة لمشروع لعبة متكامل*\n\nليه بنرشحه؟\nبعد الأساسيات، الطالب محتاج يشتغل زي مطوّري الألعاب الحقيقيين: لعبة كاملة مش تمرين صغير.\nهنا بيعمل لعبة متعددة المشاهد (Multi-Scene)، ويربط أجزاءها بالكود وأدوات محرك الألعاب.\nوبيمرّ بنفس دورة الشغل الاحترافية: يبني، يختبر، يعدّل… ويجهّز نسخة نهائية يعرضها.\n\n📚 المسار على 3 مراحل:\n• Multi-Scene & Text-Based Game Coding\n• Game Engine Level 1\n• Game Engine Level 2\n\n📚 12 حصة — حصة أسبوعيًا، ساعتين.\n✅ بنراجع مستوى الطالب قبل البداية عشان نتأكد إنه جاهز للمرحلة دي.\n\n🎥 مثال من شغل طلابنا:\nhttps://www.instagram.com/reel/DURTkJKjmML/\n\n💰 *السعر للتراك كامل:*\n👥 جروب (3–5 طلاب): 6,300 جنيه\n👤 برايفت 1:1: 9,000 جنيه — بمدرّب ثابت طول التراك + حصتين تعويض في حالة الغياب\n\nابعتولنا اختياركم: *جروب ولا برايفت؟* 👇\nوهنبعتلكم المواعيد المتاحة حضوري وأونلاين 📅", "en": "Hello 👋\nAt EduZone Tech for Coding, Robotics & AI,\n\nwe offer several tracks suited to ages 10–16 (games, apps, robotics, websites, AI), and we help you choose the best fit based on your child's age, experience, and interests.\n\nIf your child has tried coding before and wants to level up in game development, one of the strongest next steps is:\n\n🎮 *Game Engine — From Separate Exercises to a Complete Game Project*\n\nWhy we recommend it:\nAfter the basics, students need to work like real game developers: a full game, not a small exercise.\nHere they build a multi-scene game and connect its parts using code and game-engine tools.\nThey go through the same professional cycle: build, test, improve, then prepare a final version to present.\n\n📚 The track has 3 stages:\n• Multi-Scene & Text-Based Game Coding\n• Game Engine Level 1\n• Game Engine Level 2\n\n📚 12 sessions — one session a week, 2 hours each.\n✅ We review the student's level before starting to make sure they're ready for this stage.\n\n🎥 An example of our students' var nav=document.getElementById('nav'), list=document.getElementById('list');
function esc(s){return s.replace(/[&<>]/g,function(c){return {'&':'&amp;','<':'&lt;','>':'&gt;'}[c];});}
T.forEach(function(t){
  nav.insertAdjacentHTML('beforeend','<a href="#'+t.id+'" data-k="'+t.kind+'"><span class="i">'+t.icon+'</span>'+t.name+'</a>');
  var facts=[t.age].concat(t.facts).map(function(f){return '<span>'+esc(f)+'</span>';}).join('');
  function panel(l){var lab=l==='ar'?'العربي':'ENGLISH'; return '<div class="m" data-l="'+l+'"><div class="mh"><b>'+lab+'</b><div class="acts"><button class="btn" data-copy="'+t.id+'|'+l+'">📋 Copy</button><button class="btn wa" data-wa="'+t.id+'|'+l+'">💬 WhatsApp</button></div></div><pre class="'+(l==='ar'?'ar':'')+'" dir="'+(l==='ar'?'rtl':'ltr')+'">'+esc(t[l])+'</pre></div>';}
  list.insertAdjacentHTML('beforeend','<section class="card" id="'+t.id+'" data-k="'+t.kind+'"><div class="ch"><div class="ic">'+t.icon+'</div><div><span class="kind">'+t.kind+'</span><h2>'+t.name+'</h2></div></div><div class="facts">'+facts+'</div><div class="msgs">'+panel('ar')+panel('en')+'</div></section>');
});
function get(k){var p=k.split('|'),t=T.filter(function(x){return x.id===p[0];})[0];return t[p[1]];}
function toast(m){var e=document.getElementById('toast');e.textContent=m;e.classList.add('show');setTimeout(function(){e.classList.remove('show');},1400);}
function copyText(txt,b){
  var done=function(){toast('Copied ✓ — paste in WhatsApp');if(b){var o=b.innerHTML;b.innerHTML='✓ Copied';b.classList.add('ok');setTimeout(function(){b.innerHTML=o;b.classList.remove('ok');},1500);}};
  if(navigator.clipboard&&window.isSecureContext){navigator.clipboard.writeText(txt).then(done,function(){fb();});}else fb();
  function fb(){var a=document.createElement('textarea');a.value=txt;a.style.position='fixed';a.style.opacity='0';document.body.appendChild(a);a.select();try{document.execCommand('copy');done();}catch(e){toast('Select the text and copy manually');}a.remove();}
}
document.addEventListener('click',function(e){
  var b=e.target.closest('[data-copy]'); if(b){copyText(get(b.dataset.copy),b);return;}
  var w=e.target.closest('[data-wa]'); if(w){window.open('https://wa.me/?text='+encodeURIComponent(get(w.dataset.wa)),'_blank');return;}
});
function seg(id,cb){var s=document.getElementById(id);s.addEventListener('click',function(e){var b=e.target.closest('button');if(!b)return;[].forEach.call(s.children,function(x){x.classList.toggle('on',x===b);});cb(b);});}
seg('kind',function(b){var k=b.dataset.k;document.querySelectorAll('.card,.nav a').forEach(function(el){el.classList.toggle('hide',k!=='all'&&el.dataset.k!==k);});});
seg('lang',function(b){var l=b.dataset.l;document.querySelectorAll('.msgs').forEach(function(g){g.classList.toggle('one',l!=='both');});document.querySelectorAll('.m').forEach(function(m){m.classList.toggle('hide',l!=='both'&&m.dataset.l!==l);});});
var links=[].slice.call(nav.querySelectorAll('a'));
var io=new IntersectionObserver(function(es){es.forEach(function(en){if(en.isIntersecting){links.forEach(function(a){var on=a.getAttribute('href')==='#'+en.target.id;a.classList.toggle('on',on);if(on)a.scrollIntoView({block:'nearest',inline:'center'});});}});},{rootMargin:'-40% 0px -55% 0px'});
document.querySelectorAll('.card').forEach(function(c){io.observe(c);});
</script>
